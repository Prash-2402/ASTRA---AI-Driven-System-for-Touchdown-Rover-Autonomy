services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: astra, POSTGRES_PASSWORD: astra, POSTGRES_DB: astra }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U astra"], interval: 5s, retries: 10 }
  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    environment:
      ASTRA_DATABASE_URL: postgresql+psycopg2://astra:astra@db:5432/astra
      ASTRA_DATA_DIR: /data
    volumes: [astradata:/data, ./machine_learning/checkpoints:/app/machine_learning/checkpoints]
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }
  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    ports: ["5173:80"]
    depends_on: [api]
volumes: { pgdata: {}, astradata: {} }
