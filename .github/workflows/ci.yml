name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: astra, POSTGRES_PASSWORD: astra, POSTGRES_DB: astra_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -e ".[dev]"
      - run: pytest -m "not slow" -p no:warnings
        env: { ASTRA_DATABASE_URL: "postgresql+psycopg2://astra:astra@localhost:5432/astra_test" }
      - run: pytest -m slow -p no:warnings
        env: { ASTRA_DATABASE_URL: "postgresql+psycopg2://astra:astra@localhost:5432/astra_test" }
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci && npm run typecheck && npm run build
        working-directory: frontend
