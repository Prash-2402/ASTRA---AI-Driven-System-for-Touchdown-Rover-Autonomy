[project]
name = "astra"
version = "0.1.0"
description = "ASTRA - AI-Driven System for Touchdown & Rover Autonomy"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg2-binary>=2.9",
  "gymnasium>=0.29",
  "torch>=2.2",
  "stable-baselines3>=2.2",
  "pybullet>=3.2.6",
  "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["backend*", "simulation*", "autonomy*", "machine_learning*", "experiments*", "shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: long-running tests (training, batch experiments)",
  "db: requires PostgreSQL",
]
